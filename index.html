<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gilla de Eventos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="grid-container">
        <div id="click-box" class="card c1">EVENTO AQUÍ <br> <span>Click</span></div>
        <div id="hover-box" class="card c2">EVENTO AQUÍ <br> <span>Hover (Mouse over)</span></div>
        <div id="dblclick-box" class="card c3">EVENTO AQUÍ <br> <span>Double Click</span></div>
        <div id="keydown-box" class="card c4">EVENTO AQUÍ <br> <span>Presiona una tecla</span></div>
        <div id="context-box" class="card c5">EVENTO AQUÍ <br> <span>Click Derecho</span></div>
        <div id="scroll-box" class="card c6">EVENTO AQUÍ <br> <span>Rueda del Mouse</span></div>
        <div id="mouse-leave" class="card c7">EVENTO AQUÍ <br> <span>Saca el mouse</span></div>
        <div id="change-box" class="card c8">
            EVENTO AQUÍ <br> 
            <input type="text" id="input-change" placeholder="Escribe y sal">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
